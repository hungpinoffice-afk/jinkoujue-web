<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#121417" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="知微金口诀断课分析程序 — 排盘、断课、神煞、课钤解读" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
    <title>知微金口诀断课分析程序</title>
    <script type="module" crossorigin src="./assets/index-C-KySpzg.js"></script>
  </head>
  <body style="margin:0;background:#121417;">
    <div id="root">
      <div id="boot-loading" style="font-family:'Noto Serif TC',Songti TC,SimSun,serif;padding:4.5rem 1.5rem;text-align:center">
        <div style="color:#C9A227;font-size:1.12rem;letter-spacing:.34em">知微金口诀</div>
        <div style="color:#7C766A;font-size:0.7rem;letter-spacing:.4em;margin-top:8px">断课分析程序</div>
        <div id="boot-hint" style="font-size:0.78rem;color:#5E5A52;margin-top:22px;letter-spacing:.1em">数据加载中，请稍候…</div>
      </div>
    </div>
    <script>
      (function () {
        var failed = false;   // 已經顯示明確原因後，不要再被計時器蓋掉
        function hint(text) {
          if (failed) return;
          var el = document.getElementById('boot-hint');
          if (el) el.textContent = text;
        }
        // 程式檔（module）載入失敗時，多半是「被嵌在沙箱預覽面板中」——
        // 這種環境會把跨來源的 module 擋掉，畫面會一直停在載入中，
        // 必須明講原因並給替代做法，否則使用者會以為程式壞了。
        window.addEventListener('error', function (e) {
          var t = e && e.target;
          if (t && t.tagName === 'SCRIPT') {
            failed = true;
            var el = document.getElementById('boot-hint');
            if (el) el.textContent = '程式檔載入失敗。若您是在「預覽面板／內嵌視窗」中開啟，該環境會阻擋程式載入，請改用瀏覽器直接開啟本網址，或使用單檔離線電腦版。';
          }
        }, true);
        setTimeout(function () {
          hint('数据量较大，仍在加载中…若超过 1 分钟请检查网络后重新整理。');
        }, 10000);
        setTimeout(function () {
          if (document.getElementById('boot-hint')) {
            hint('仍未載入完成。請確認網路連線；若您是在預覽面板中開啟，請改用瀏覽器開啟網址，或使用單檔離線電腦版。');
          }
        }, 40000);
      })();
    </script>
  </body>
</html>
